<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#000000"/>

  <!-- Main Logo Group -->
  <g fill="none" stroke="#19E3E6" stroke-width="8" filter="url(#glow)" stroke-linejoin="round">

    <!-- P -->
    <path d="M120 400 L120 200 L200 200 Q260 200 260 260 Q260 320 200 320 L120 320"/>

    <!-- R -->
    <path d="M260 400 L260 200 L340 200 Q400 200 400 260 Q400 320 340 320 L260 320"/>
    <path d="M340 320 L420 400"/>

    <!-- O -->
    <polygon points="420,200 500,260 500,360 420,420 340,360 340,260"/>

  </g>

  <!-- Subtitle -->
  <text x="300" y="500" text-anchor="middle"
        font-family="Montserrat, Arial, sans-serif"
        font-size="28"
        letter-spacing="4"
        fill="#CCCCCC">
    NET SOLUTIONS
  </text>

</svg>